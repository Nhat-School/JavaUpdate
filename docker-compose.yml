version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: f1_championship_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: Cnpm@2020?
      MYSQL_DATABASE: f1championship
    ports:
      - "3308:3306"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./db_data:/var/lib/mysql
